name: guardrails
on: [push, pull_request]
permissions:
  contents: read
jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No SQL logic (ADR-0002)
        run: ./tools/check-no-sql-logic.sh
      - name: Schema applies cleanly
        run: |
          for f in crates/mrk-store/migrations/*.sql; do sqlite3 :memory: < "$f"; done
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
